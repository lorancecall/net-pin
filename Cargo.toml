[package]
name = "net-pin"
version = "0.3.3"
edition = "2024"
build = "build.rs"
description = "Pin traffic to a network on Windows: internet, VPN tunnels and routes over the network you choose, with kill switches"
license = "MIT"

[lib]
name = "net_pin"
path = "src/lib.rs"

[[bin]]
name = "net-pin"
path = "src/main.rs"

[[bin]]
name = "net-pin-tray"
path = "src/tray.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Wdk_System_SystemInformation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock",
] }
windows-service = "0.8.1"
winreg = "0.56.0"

[build-dependencies]
embed-resource = "3.0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# unwind (not abort): the service restarts its watch loop after a panic.
strip = true
